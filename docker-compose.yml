version: "3.8"

services:
    app:
        build:
            context: .
        restart: unless-stopped
        ports:
            - "${APP_PORT}:8000"
        volumes:
            - ~/tts_app_data:/app/storage/app/public
            - ~/tts_app_logs:/app/storage/logs
        depends_on:
            - db

    db:
        image: postgres:17.6
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - ~/tts_db_data:/var/lib/postgresql/data

    supervisor:
        build:
            context: .
            dockerfile: supervisor/supervisor.dockerfile
        restart: unless-stopped
        volumes:
            - ~/tts_supervisor_logs:/var/www/html/storage/logs
        depends_on:
            -   db
