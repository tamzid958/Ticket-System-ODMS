version: "3.8"

services:
    app:
        build:
            context: .
        container_name: tts-odms
        restart: unless-stopped
        ports:
            - "${APP_PORT}:8000"
        depends_on:
            - db

    db:
        image: postgres:latest
        container_name: tts_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - ~/tts_db_data:/var/lib/postgresql/data

    supervisor:
        build:
            context: .
            dockerfile: supervisor/supervisor.dockerfile
        container_name: supervisor
        restart: unless-stopped
        depends_on:
            -   db
